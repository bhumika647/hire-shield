<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Applicant Review | Hire Shield</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Open+Sans&display=swap" rel="stylesheet" />
  <style>
    html,
    body {
      min-height: 100vh;
      background: radial-gradient(ellipse 120% 100% at center, #223155 0%, #161d25 85%);
      font-family: 'Open Sans', Arial, sans-serif;
      color: #e6eaff;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    .particles-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 45% 40%, #36ccf9bb 0%, #8f4afb10 100%);
      opacity: .14;
      animation: float 15s linear infinite;
    }

    @keyframes float {
      0% {
        transform: translateY(0) scale(1);
      }

      50% {
        opacity: .22;
        transform: translateY(-45vh) scale(1.07);
      }

      100% {
        opacity: .14;
        transform: translateY(-95vh) scale(1);
      }
    }

    .review-center {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2vw;
    }

    .review-card {
      max-width: 1120px;
      min-width: 600px;
      width: 88vw;
      background: linear-gradient(120deg, rgba(34, 58, 97, 0.96) 78%, rgba(84, 183, 255, 0.11) 100%);
      border-radius: 2em;
      box-shadow: 0 10px 38px #1d2c51b0, 0 2px 27px #36ccf970;
      border: 2px solid #36ccf97d;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      z-index: 1;
      padding: 0;
    }

    .review-side {
      flex: 0 0 280px;
      background: rgba(37, 65, 122, 0.48);
      border-radius: 2em 0 0 2em;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 3em 2em 3em 2em;
      min-height: 480px;
    }

    .logo {
      width: 78px;
      height: 78px;
      margin-bottom: 29px;
      filter: drop-shadow(0 0 15px #36ccf9f3);
      /* Animation Removed */
    }

    h2 {
      font-family: 'Orbitron', 'Segoe UI', sans-serif;
      font-size: 1.65em;
      font-weight: 900;
      letter-spacing: .04em;
      background: linear-gradient(90deg, #36ccf9 15%, #8f4afb 85%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 3px 15px #34588c41;
      margin: 0 0 1.4em 0;
      text-align: center;
    }

    .features-list {
      margin: 6px 0 0 0;
      width: 100%;
      padding: 0;
      list-style: none;
    }

    .features-list li {
      color: #fadfffcc;
      font-size: 1.1em;
      font-weight: 600;
      margin-bottom: .31em;
    }

    /* Modern glassmorphic select dropdown */
select {
  appearance: none;
  -webkit-appearance: none;
  background: linear-gradient(110deg, rgba(44,96,154,0.87), rgba(143,74,251,0.18) 70%);
  border: 2.2px solid #36ccf9;
  padding: .75em 1em;
  border-radius: 1.2em;
  color: #fff;
  font-weight: 700;
  font-size: 1.1em;
  box-shadow: 0 4px 20px #36ccf944, 0 2px 10px #8f4afb1a;
  transition: box-shadow 0.18s, border 0.15s, background 0.21s;
  outline: none;
  cursor: pointer;
  margin-bottom: 1.2em;
  position: relative;
}

select:focus, select:hover {
  border: 2.5px solid #8f4afb;
  background: linear-gradient(113deg, #253985a8 18%, #36ccf959 100%);
  box-shadow: 0 0 0 4px #36ccf96c, 0 6px 20px #8f4afb42;
  color: #e6eaff;
}

select option {
  background: #223155;
  color: #36ccf9;
  font-weight: 700;
  font-size: 1.05em;
  border-radius: 0.8em;
  padding: 14px 10px;
  transition: background 0.21s,color 0.21s;
  border: none;
}

select option:checked,
select option:hover {
  background: #36ccf9;
  color: #223155;
}

/* Custom dropdown arrow using pseudo-elements */
select {
  background-image: url("data:image/svg+xml;charset=UTF-8,<svg width='20' height='10' viewBox='0 0 20 10' fill='none' xmlns='http://www.w3.org/2000/svg'><path d='M1 1L10 9L19 1' stroke='%238f4afb' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat: no-repeat;
  background-position: right 1em top 52%, 0 0;
  background-size: 2em auto, 100%;
  padding-right: 2.7em;
}


    .review-main {
      flex: 1 1 420px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 2.6em 2.6em 2.6em 2.6em;
    }

    .prediction-block {
      width: 100%;
      background: rgba(31, 47, 77, 0.28);
      border-radius: 1.1em;
      padding: .82em .95em .72em .95em;
      margin-bottom: 1.03em;
      color: #ffefbd;
      font-weight: 700;
      font-size: 1.18em;
      text-align: center;
      letter-spacing: .03em;
      box-shadow: 0 0 11px #8f4afb3b;
    }

    form {
      width: 100%;
    }

    label {
      color: #91d1ff;
      font-weight: 700;
      font-size: 1.06em;
      margin-top: .58em;
    }

    select,
    textarea {
      margin: .31em 0 1.3em 0;
      width: 100%;
      font-size: 1.06em;
      padding: .75em 1.08em;
      border-radius: 1em;
      border: 2px solid #18294823;
      background: rgba(246, 249, 255, 0.10);
      color: #16343f;
      font-weight: 600;
      transition: border .17s, box-shadow .14s;
      box-shadow: 0 1px 7px #36ccf93a;
      outline: none;
      resize: vertical;
      transition: all 0.3s ease;
    }

    select:hover,
    textarea:hover,
    select:focus,
    textarea:focus {
      border: 2px solid #36ccf9;
      box-shadow: 0 3px 21px #8f4afb9a;
      background: rgba(246, 255, 255, 0.25);
      color: #112c3a;
    }

    .char-count {
      float: right;
      color: #8f4afb;
      font-size: .99em;
      margin-top: -1.5em;
      margin-bottom: 1.2em;
    }

    .actions {
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 1.35em;
    }

    button[type="submit"] {
      border-radius: 2em;
      border: none;
      cursor: pointer;
      font-weight: 800;
      letter-spacing: .06em;
      font-size: 1.06em;
      padding: .72em 2.5em;
      margin-top: .13em;
      background: linear-gradient(93deg, #36ccf9 16%, #8f4afb 95%);
      color: #fff;
      box-shadow: 0 2px 18px #36ccf950;
      transition: background .19s, box-shadow .16s, transform .14s;
      user-select: none;
    }

    button[type="submit"]:hover {
      background: linear-gradient(93deg, #8f4afb 18%, #36ccf9 97%);
      box-shadow: 0 9px 24px #8f4afb65;
      transform: scale(1.05);
    }

    @media (max-width: 1000px) {
      .review-card {
        flex-direction: column;
        max-width: 96vw;
      }

      .review-side,
      .review-main {
        border-radius: 2em 2em 0 0;
        min-height: 0;
        padding-bottom: 1.2em;
      }

      .review-main {
        border-radius: 0 0 2em 2em;
      }

      .logo {
        width: 72px;
        height: 72px;
      }
    }

    @media (max-width: 600px) {
      .review-card {
        padding: 0;
      }

      .review-side {
        padding: 1.19em .4em 1.2em 1.2em;
      }

      .review-main {
        padding: 1.17em .8em 1.17em .8em;
      }

      h2 {
        font-size: 1em;
      }
    }
    .close-btn {
  position: absolute;
  top: 6.5rem;
  right: 13.5rem;
  width: 38px;
  height: 38px;
  font-size: 1.7rem;
  color: white;
  background: #ef5350; /* solid red fill */
  border: none;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  text-decoration: none;
  font-weight: 900;
  user-select: none;
  transition: background-color 0.3s ease, color 0.3s ease;
  cursor: pointer;
  animation: pulse 1.5s infinite;
  box-shadow: 0 0 20px #ef5350cc;
  z-index: 99;
}

.close-btn:hover,
.close-btn:focus {
  background: #b71c1c;
  color: #fff;
  outline: none;
}

@keyframes pulse {
  0% {
    box-shadow: 0 0 10px #ef5350cc;
  }
  50% {
    box-shadow: 0 0 20px #ef535088;
  }
  100% {
    box-shadow: 0 0 10px #ef5350cc;
  }
}

  </style>
</head>

<body>
  <div class="particles-bg" id="particles-bg"></div>
  <div class="review-center">
    <div class="review-card">
      <a href="{{ url_for('review_predictions') }}" class="close-btn" aria-label="Close and return to review predictions">&times;</a>
      <div class="review-side">
        <img src="{{ url_for('static', filename='images/Hire-Shield-Logo.png') }}" class="logo" alt="Hire Shield Logo" />
        <h2>Applicant Review</h2>
        <ul class="features-list">
          {% for key, value in log.features.items() %}
          <li><span style="color:#36ccf9;">{{ key }}:</span> {{ value }}</li>
          {% endfor %}
        </ul>
      </div>
      <div class="review-main">
        <div class="prediction-block">Model Output: <span style="color: #36ccf9;">{{ log.prediction }}</span></div>
        <form method="post" autocomplete="off">
          <label for="review_label">Review/Correction:</label>
          <select name="review_label" required>
            <option value="">--Select--</option>
            <option value="Placed" {% if log.review_label == "Placed" %}selected{% endif %}>Placed</option>
            <option value="Not Placed" {% if log.review_label == "Not Placed" %}selected{% endif %}>Not Placed</option>
          </select>
          <label for="review_note">Comments (max 500 characters):</label>
          <textarea name="review_note" rows="4" maxlength="500" placeholder="Add comments here..." oninput="updateCharCount(this)">{{ log.review_note or '' }}</textarea>
          <span class="char-count" id="charCount">0/500</span>
          <div class="actions">
            <button type="submit">Save Review</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script>
    const particlesCount = 27;
    const bg = document.getElementById('particles-bg');
    for (let i = 0; i < particlesCount; i++) {
      let p = document.createElement('div');
      p.className = 'particle';
      let sz = 26 + Math.random() * 120;
      p.style.width = sz + 'px';
      p.style.height = sz + 'px';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.top = Math.random() * 100 + 'vh';
      p.style.animationDuration = 8.5 + Math.random() * 14 + 's';
      p.style.animationDelay = Math.random() * 7.3 + 's';
      bg.appendChild(p);
    }
    function updateCharCount(el) {
      document.getElementById('charCount').textContent = el.value.length + "/500"
    }
    document.addEventListener('DOMContentLoaded', function() {
      var ta = document.querySelector('textarea[name="review_note"]')
      if (ta) updateCharCount(ta)
    })
  </script>
</body>

</html>
