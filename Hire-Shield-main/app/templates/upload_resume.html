<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Upload Resume | Hire Shield</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Lato:wght@600&family=Open+Sans&display=swap" rel="stylesheet" />
  <style>
    html, body {
      height: 100%; margin: 0; padding: 0;
      background: radial-gradient(ellipse 110% 80% at 60% 45%, #223155 0%, #181d25 85%);
      font-family: 'Open Sans', Arial, sans-serif; color: #e9f2fa; display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .particles-bg { pointer-events: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; }
    .particle { position: absolute; border-radius: 50%; background: radial-gradient(circle at 45% 40%, #36ccf9bb 0%, #8f4afb19 100%); opacity:.14; animation: float 14s linear infinite;}
    @keyframes float {0%{transform:translateY(0) scale(1);}50%{opacity:.21;transform:translateY(-44vh) scale(1.09);}100%{opacity:.11;transform:translateY(-110vh) scale(1);}}
    .upload-container { min-height: 100vh; width: 100vw; display: flex; align-items:center; justify-content:center; z-index:1;}
    .upload-card {
      background: linear-gradient(112deg,rgba(34,50,77,0.95) 68%,rgba(55,97,150,0.22) 100%);
      box-shadow: 0 18px 55px #223760ad, 0 7px 21px #36ccf959;
      border-radius: 2.5em;
      padding: 2.2em 4.2em 2.2em 4.2em;
      max-width: 610px; width: 98vw; min-width:380px;
      display: flex; flex-direction: column; align-items: center;
    }
    .logo-img { width:58px; height:58px; margin-bottom:.65em; filter:drop-shadow(0 0 12px #36ccf9cc);}
    h1 {
      font-family:'Orbitron','Segoe UI',sans-serif;
      font-size: 1.2em; font-weight: 900; margin: .33em 0 1.1em 0;
      background: linear-gradient(90deg,#36ccf9 15%,#8f4afb 77%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: 0.055em; user-select:none; text-align:center;
    }
    .progress-container { width:100%; margin-bottom:1.1em;}
    .progress-label { font-weight:600; color:#77b6ff; font-size:1em; margin-bottom: 4px;}
    .progress-bar-bg { background:#16293a; height:8px; border-radius:5px; overflow:hidden;}
    .progress-bar-fill { width:100%; height:100%; background:linear-gradient(90deg,#36ccf9,#8f4afb); border-radius:inherit; animation:progressFill .97s cubic-bezier(.64,.18,.58,1.1) forwards;}
    @keyframes progressFill{from{width:0;}to{width:100%;}}
    /* Centers all "cards" */
    .center-content { display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; }
    .privacy-badge {
      display: flex; align-items:center; gap:0.48em;
      font-size: 1.05em; color: #65e3d6; font-weight: bold;
      background: rgba(44,82,91,0.38); border-radius: 1.35em; padding: 10px 20px 11px 15px;
      margin: 0 0 1.1em 0; user-select:none; transition: background .23s;
      box-shadow: 0 2px 11px #3eead077; border: 1.2px solid #43e9fab6;
      text-align: center;
    }
    .privacy-badge .icon { font-size: 1.34em; color: #14f5b3; filter: drop-shadow(0 0 7px #4cf7e7cc);}
    .drag-area {
      width: 100%; max-width:370px; min-height: 120px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      border: 2.2px dashed #53e0fa; border-radius: 1.35em;
      background: rgba(39,70,108,0.68); color: #beebfa; font-size: 1.1em;
      font-weight: 700; margin-bottom: .63em; box-shadow: 0 2px 21px #36ccf93a, 0 1.5px 7px #181d2552;
      outline: none; transition: border-color .23s, box-shadow .14s, background .18s;
      backdrop-filter: blur(13px); cursor: pointer; position: relative; user-select: none; text-align: center;
    }
    .drag-area.dragover { border-color: #8f4afb; background: rgba(93,86,200,0.15);}
    .file-label { margin-bottom: .25em; font-size: 1.16em; color: #bcdeff; font-family: 'Lato', 'Segoe UI', Arial,sans-serif; }
    .file-preview {
      display:flex;align-items:center;gap:.54em; margin:0.12em 0 .31em 0;
      color:#8bdeec;font-family:'Lato',sans-serif;font-size:1.13em;font-weight:700;user-select:text;
    }
    .file-icon {
      font-size:1.18em;
      background: linear-gradient(93deg,#36ccf9,#8f4afb 67%);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:900;
      filter: drop-shadow(0 0 2px #50ecfff5);
    }
    .file-note {
      color: #92eafb; font-size: 1.04em; opacity: .88;
      background: rgba(42,70,101,0.23); padding:5px 13px 5px 13px; border-radius: .9em;
      margin-bottom: .10em; font-family:'Lato',sans-serif; user-select:none; letter-spacing:.01em;
    }
    .upload-form { width:100%; display:flex; flex-direction:column; align-items:center;}
    .upload-btn {
      width: 100%; max-width:295px; margin-top:.2em;
      padding: 1.08em 0; font-size: 1.14em; font-weight:800; border-radius:1.42em; border:none;
      color:white; background:linear-gradient(90deg,#36ccf9 17%,#8f4afb 84%);
      box-shadow:0 5px 21px #8f4afb9a; cursor:pointer; position:relative;overflow:hidden;
      transition: box-shadow .13s, transform .11s, background .16s; letter-spacing: .03em;
      text-align:center;
    }
    .upload-btn:active::after {
      content: '';
      display: block;
      position: absolute; left: 50%; top: 50%;
      width: 0; height: 0; background: rgba(54,204,249,0.26); border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: ripple_anim 0.48s linear; z-index:1;
    }
    @keyframes ripple_anim { 0% { width: 0; height: 0; opacity: 1; }
      80% { width: 260px; height: 260px; opacity: .32;}
      100% { width: 340px; height: 340px; opacity: 0;}
    }
    .upload-btn:hover, .upload-btn:focus {
      background:linear-gradient(92deg,#8f4afb,#36ccf9);
      box-shadow:0 8px 19px #8f4afbda;
      transform: scale(1.04);
      color:#fff;
    }
    .error-bar {
      margin:.12em 0 .85em 0; background:rgba(38,30,50,0.62);
      color:#ffaebc; font-weight:700; font-size:.99em; border-radius:.8em;
      font-family:'Lato','Segoe UI',Arial; padding: 8px 21px 9px 21px;
      box-shadow:0 2px 8px #e8677969;
      text-align:center;max-width:360px;
    }
    .page-footer {
      margin-top: 1.15em; font-family:'Orbitron','Lato','Segoe UI',Arial;
      font-size:0.93em; letter-spacing: .03em; color:#a2bffe;text-align:center;
      user-select:none; opacity: .96; border-top: 1.2px solid #2e4fd133; padding-top: .19em;
      background: linear-gradient(to right, #1c253f11, #4e78a822 55%, #181d2500 100%);
    }
    @media (max-width:800px){
      .upload-card{max-width:98vw;padding:1.4em .2em;}
      .drag-area,.upload-btn{max-width:97vw;}
    }
    .back-btn {
  position: absolute;
  top: 7.5rem;
  left: 26rem;
  padding: 0.4em 0.9em;
  font-size: 1.0rem;
  font-weight: 700;
  color: #ffffff; /* white text */
  background: #ef5350; /* filled soft red */
  border: none; /* no outline */
  border-radius: 0.8em;
  text-decoration: none;
  user-select: none;
  transition: background 0.22s, color 0.22s, transform 0.3s;
  display: inline-flex;
  align-items: center;
  gap: 0.3em;
  cursor: pointer;
  animation: pulse 1.5s infinite;
  box-shadow: 0 0 20px #ef5350cc; /* glow consistent with the red color */
}

.back-btn:hover,
.back-btn:focus {
  background: #b71c1c;
  color: #fff;
  outline: none;
}
@keyframes pulse {
  0% { box-shadow: 0 0 10px #ef5350cc;}
  50% { box-shadow: 0 0 20px #ef535088;}
  100% { box-shadow: 0 0 10px #ef5350cc;}
}
  </style>
</head>
<body>
  <div class="particles-bg" id="particles-bg"></div>
  <div class="upload-container">
    <div class="upload-card">
      <a href="{{ url_for('applicant_method') }}" class="back-btn" aria-label="Back to Home">
  &#8678; Back
</a>
      <img src="{{ url_for('static', filename='images/Hire-Shield-Logo.png') }}" alt="Hire Shield Logo" class="logo-img" />
      <h1>Upload Your Resume</h1>
      <div class="progress-container">
        <div class="progress-label">Step 2 of 2</div>
        <div class="progress-bar-bg"><div class="progress-bar-fill"></div></div>
      </div>
      <div class="center-content">
        <div class="privacy-badge"><span class="icon">🔒</span> 100% Private. Your file is processed securely &amp; never stored.</div>
        {% if error %}
          <div class="error-bar">{{ error }}</div>
        {% endif %}
        <form method="post" enctype="multipart/form-data" autocomplete="off" novalidate class="upload-form" id="resumeForm">
          <div id="dragArea" class="drag-area" tabindex="0">
            <div class="file-label">Choose File or Drag &amp; Drop</div>
            <input type="file" name="resume" accept=".pdf,.txt" required style="display:none;" id="resumeInput"/>
            <div id="filePreview" class="file-preview" style="display:none;">
              <span class="file-icon" id="fileIcon"></span>
              <span id="fileName"></span>
            </div>
            <div class="file-note">Only PDF or TXT files, max 2MB.</div>
          </div>
          <button type="submit" class="upload-btn" id="uploadBtn">Upload</button>
        </form>
      </div>
      <footer class="page-footer">
        © 2025 <b>Hire Shield™</b> &mdash; Secure, Unbiased AI Campus Placement
      </footer>
    </div>
  </div>
  <script>
    // Bubble animation
    const particlesCount = 22, bg = document.getElementById('particles-bg');
    for(let i=0;i<particlesCount;i++){
      let p=document.createElement('div');
      p.className='particle';
      let sz=29+Math.random()*64;
      p.style.width=sz+'px';p.style.height=sz+'px';
      p.style.left=Math.random()*100+'vw';p.style.top=Math.random()*100+'vh';
      p.style.animationDuration=9+Math.random()*9+'s';
      p.style.animationDelay=Math.random()*6+'s';
      bg.appendChild(p);
    }
    // Drag and file preview logic
    const dragArea = document.getElementById('dragArea');
    const input = document.getElementById('resumeInput');
    const filePreview = document.getElementById('filePreview');
    const fileName = document.getElementById('fileName');
    const fileIcon = document.getElementById('fileIcon');
    function updatePreview(file) {
      if (!file) {
        filePreview.style.display = "none"; fileName.textContent = ''; fileIcon.textContent='';
        return;
      }
      filePreview.style.display = "";
      fileName.textContent = file.name;
      if (file.type === "application/pdf" || file.name.endsWith('.pdf')) {
        fileIcon.textContent = "📄";
      } else if (file.type === "text/plain" || file.name.endsWith('.txt')) {
        fileIcon.textContent = "📑";
      } else { fileIcon.textContent = "❓"; }
    }
    dragArea.addEventListener('click',()=>input.click());
    dragArea.addEventListener('keydown',(e)=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();input.click();}});
    dragArea.addEventListener('dragover', e => {e.preventDefault();dragArea.classList.add('dragover');});
    dragArea.addEventListener('dragleave', e => {e.preventDefault();dragArea.classList.remove('dragover');});
    dragArea.addEventListener('drop', function(e){
      e.preventDefault(); dragArea.classList.remove('dragover');
      const files = e.dataTransfer.files;
      if (files.length) { input.files = files; updatePreview(files[0]); }
    });
    input.addEventListener('change', function(){
      updatePreview(this.files[0]);
    });
  </script>
</body>
</html>
