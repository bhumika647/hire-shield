<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Student Placement Prediction | Hire Shield</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Lato:wght@700&family=Open+Sans&display=swap" rel="stylesheet" />
  <style>
    html, body { height: 100%; margin: 0; padding: 0; background: radial-gradient(ellipse 110% 80% at 60% 45%, #223155 0%, #181d25 85%);
      font-family: 'Open Sans', Arial, sans-serif; color: #e9f2fa; display: flex; align-items: center; justify-content: center; overflow: hidden;}
    .particles-bg { pointer-events: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0;}
    .particle { position:absolute; border-radius:50%; background:radial-gradient(circle at 45% 40%, #36ccf9bb 0%, #8f4afb19 100%); opacity:.14; animation:float 14s linear infinite;}
    @keyframes float {0%{transform:translateY(0) scale(1);}50%{opacity:.23;transform:translateY(-44vh) scale(1.13);}100%{opacity:.11;transform:translateY(-110vh) scale(1);}}
    .manual-container { min-height: 100vh; width:100vw; display:flex; align-items:center; justify-content:center; z-index:1;}
    .manual-card {
      background: linear-gradient(112deg,rgba(34,50,77,0.93) 68%,rgba(55,97,150,0.22)100%);
      box-shadow: 0 18px 55px #22376089, 0 7px 18px #36ccf951;
      border-radius: 2.1em;
      padding: 1.0em 3em 1.0em 3em; /* reduced top/bottom padding */
      max-width: 820px; /* slightly reduced */
      min-width: 410px;
      width: 97vw;
      display: flex; flex-direction: column; align-items: center;
    }
    .logo-img { width:54px; height:54px; margin-bottom:.5em; filter:drop-shadow(0 0 10px #36ccf9cc);}
    h1 {
      font-family:'Orbitron','Segoe UI',sans-serif;
      font-size: 1.18em; font-weight: 900; margin-bottom: 2.0em;
      margin-top: 0.35em;
      background: linear-gradient(90deg,#36ccf9 9%,#8f4afb 66%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: 0.045em; user-select:none;
    }
    .progress-container { width:99%; margin-bottom:1em;}
    .progress-label { font-weight:600; color:#77b6ff; font-size:.97em; margin-bottom: 4px;}
    .progress-bar-bg { background:#16293a; height:7px; border-radius:4px; overflow:hidden;}
    .progress-bar-fill { width:100%; height:100%; background:linear-gradient(90deg,#36ccf9,#8f4afb); border-radius:inherit; animation:progressFill 1.1s cubic-bezier(.64,.18,.58,1.1) forwards;}
    @keyframes progressFill{from{width:0;}to{width:100%;}}
    form { width:100%; margin: 0;}
    .fields-grid {
      display: flex; flex-wrap: wrap;
      gap: 1.1em 2.3em;
      width: 100%;
      justify-content: space-between;
      margin-bottom: 0.8em;
    }
    .form-group {
      flex: 1 1 44%; min-width: 180px;
      display: flex; flex-direction: column;
      margin-bottom: 0.02em;
    }
    .form-group.fullwidth { flex: 1 1 98%; }
    label { font-weight: 650; margin-bottom: .02em; color: #8fd8ff; letter-spacing: .008em; font-size: 0.97em;}
    input, select {
      padding: .65em 1.1em;
      font-size: 1.03em;
      border-radius: 1.2em;
      border: none;
      background: rgba(38,61,100,0.59);
      color: #cde5fd;
      font-weight: 600;
      box-shadow: 0 2px 13px #26cdf92e, 0 1.5px 3px #181d2566;
      outline: none; margin-bottom: .03em;
      transition: box-shadow .18s, background .15s, color .15s, border .14s;
      backdrop-filter: blur(8px);
    }
    input:focus, select:focus {
      background: rgba(60,99,173,0.69);
      box-shadow: 0 0 14px #36ccf9cc, 0 2px 7px #5639f95c;
      color: #fff;
      border: 2px solid #6ae0ff;
    }
    input::placeholder {
      color: #72caf8;
      opacity: .66;
      font-style: italic;
      font-family: 'Lato', 'Segoe UI', Arial, sans-serif;
      letter-spacing: .01em;
    }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none; margin: 0;
    }
    input[type="number"] { appearance:textfield; -moz-appearance:textfield; }
    select {
      appearance: none; -webkit-appearance: none; -moz-appearance: none;
      background: rgba(38,61,100,0.58);
      color: #def0ff;
      box-shadow: 0 2px 19px #26cdf934, 0 1.5px 5px #26cdf916;
      font-weight: 700;
      font-family: 'Lato', 'Segoe UI', Arial, sans-serif;
      border-radius: 1.16em;
      outline: none;
    }
    select:focus {
      border: 2px solid #8f4afb;
      color: #fff;
      background: rgba(93,86,200,0.31);
    }
    select option {
      background: rgba(18,28,58,0.91);
      color: #b7cffb;
      font-family: 'Lato', 'Segoe UI', Arial, sans-serif;
      border-radius: 0.90em;
      font-size: 1.01em;
      box-shadow: 0 0 9px #406aff34;
      margin: 7px 0;
      padding: 6px 14px;
    }
    .submit-btn {
      width:100%;
      padding:0.91em 0; font-size:1.13em; font-weight:850; border-radius:1.35em; border:none;
      color:white; background:linear-gradient(92deg,#36ccf9,#8f4afb);
      box-shadow:0 4px 16px #8f4afb9c; cursor:pointer; margin-top:.18em;
      transition: background .12s, box-shadow .10s, transform .09s;
    }
    .submit-btn:hover, .submit-btn:focus {
      background:linear-gradient(92deg,#8f4afb,#36ccf9);
      box-shadow:0 5px 13px #6036fbbc;
      transform: scale(1.03);
    }
    .page-footer {
      margin-top: .7em;
      font-family:'Orbitron','Lato','Segoe UI',Arial;
      font-size:0.93em;
      letter-spacing: .03em;
      color:#a0c4ffce;
      text-align:center;
      user-select:none;
      opacity: .98;
      border-top: 1.5px solid #2e4fd155;
      padding-top: .28em;
      font-variant: small-caps;
      background: linear-gradient(to right, #1c253f11, #4e78a822 55%, #181d2500 100%);
    }
    @media (max-width:900px){
      .manual-card{max-width:99vw;padding:0.9em 0.6em;}
      .fields-grid{gap: .54em 0.62em;}
      .form-group,.form-group.fullwidth {min-width:92vw;}
    }
    @media (max-width:700px){
      .fields-grid{flex-direction:column;gap:0.10em;}
      .form-group,.form-group.fullwidth {min-width:97vw;}
      .manual-card { padding:0.1em 0.04em; }
      h1{ font-size:.92em; margin-bottom:1.13em; }
    }
  </style>
</head>

<script>
function showError(input, msg) {
  let err = input.parentNode.querySelector('.error-msg');
  if (!err) {
    err = document.createElement('div');
    err.className = 'error-msg';
    err.style.cssText = `
      background:rgba(41,56,100,0.74);
      color:#ff5f70;
      border-radius:.8em;
      font-size:.87em;
      font-family:'Lato', 'Segoe UI', Arial,sans-serif;
      margin-top:.13em;
      margin-bottom:.08em;
      padding:3.5px 8px;
      box-shadow:0 1px 7px #8f4afb30;`;
    input.parentNode.appendChild(err);
  }
  err.textContent = msg;
}
function clearError(input) {
  let err = input.parentNode.querySelector('.error-msg');
  if (err) err.remove();
}

function validateField(input) {
  let val = input.value.trim();
  if (input.type === 'number') {
    let min = input.min ? parseFloat(input.min) : -Infinity;
    let max = input.max ? parseFloat(input.max) : Infinity;
    if (val === '' || isNaN(val)) {
      showError(input, 'This field is required');
      return false;
    }
    let n = parseFloat(val);
    if (n < min || n > max) {
      showError(input, `Must be ${min} to ${max}`);
      return false;
    }
  } else if (input.tagName === 'SELECT') {
    if (!val) {
      showError(input, 'Choose an option');
      return false;
    }
  } else {
    if (!val) {
      showError(input, 'This field is required');
      return false;
    }
  }
  clearError(input);
  return true;
}

document.querySelectorAll('.form-group input, .form-group select').forEach(field => {
  field.addEventListener('blur', function(){ validateField(field); });
  field.addEventListener('input', function(){ validateField(field); });
  field.addEventListener('change', function(){ validateField(field); });
});

// Validate all fields on submit
document.querySelector('form').addEventListener('submit', function(e) {
  let ok = true;
  document.querySelectorAll('.form-group input, .form-group select').forEach(field => {
    if (!validateField(field)) ok = false;
  });
  if (!ok) e.preventDefault();
});
</script>
<style>
/* For glassy animated error popups */
.error-msg {
  animation: fadeGlassErr .39s cubic-bezier(.55,.02,.61,1.32);
}
@keyframes fadeGlassErr {
  from { opacity:0; transform:scale(.9); }
  to { opacity:1; transform:scale(1);}
}
.back-btn {
  position: absolute;
  top: 3.5rem;
  left: 21rem;
  padding: 0.4em 0.9em;
  font-size: 1.0rem;
  font-weight: 700;
  color: #ffffff; /* white text */
  background: #ef5350; /* filled soft red */
  border: none; /* no outline */
  border-radius: 0.8em;
  text-decoration: none;
  user-select: none;
  transition: background 0.22s, color 0.22s, transform 0.3s;
  display: inline-flex;
  align-items: center;
  gap: 0.3em;
  cursor: pointer;
  animation: pulse 1.5s infinite;
  box-shadow: 0 0 20px #ef5350cc; /* glow consistent with the red color */
}

.back-btn:hover,
.back-btn:focus {
  background: #b71c1c;
  color: #fff;
  outline: none;
}
@keyframes pulse {
  0% { box-shadow: 0 0 10px #ef5350cc;}
  50% { box-shadow: 0 0 20px #ef535088;}
  100% { box-shadow: 0 0 10px #ef5350cc;}
}
</style>

<body>
  <div class="particles-bg" id="particles-bg"></div>
  <div class="manual-container">
    <div class="manual-card">
      <a href="{{ url_for('applicant_method') }}" class="back-btn" aria-label="Back to Home">
  &#8678; Back
</a>
      <img src="{{ url_for('static', filename='images/Hire-Shield-Logo.png') }}" alt="Hire Shield Logo" class="logo-img" />
      <h1>Enter Your Academic Details</h1>
      <div class="progress-container">
        <div class="progress-label">Step 2 of 2</div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill"></div>
        </div>
      </div>
      <form method="post" autocomplete="off" novalidate>
        <div class="fields-grid">
          <div class="form-group">
            <label for="tenth_score">10th Grade Percentage</label>
            <input type="number" name="tenth_score" id="tenth_score" min="0" max="100" required placeholder=""/>
          </div>
          <div class="form-group">
            <label for="twelfth_score">12th Grade Percentage</label>
            <input type="number" name="twelfth_score" id="twelfth_score" min="0" max="100" required placeholder=""/>
          </div>
          <div class="form-group">
            <label for="cgpa">CGPA</label>
            <input type="number" name="cgpa" id="cgpa" min="0" max="10" required placeholder=""/>
          </div>
          <div class="form-group">
            <label for="aptitude_score">Aptitude Score(0-100)</label>
            <input type="number" name="aptitude_score" id="aptitude_score" min="0" max="100" required placeholder=""/>
          </div>
          <div class="form-group">
            <label for="gender">Gender</label>
            <select name="gender" id="gender" required>
              <option value="">Select</option>
              <option value="0">Female</option>
              <option value="1">Male</option>
            </select>
          </div>
          <div class="form-group">
            <label for="board">Board</label>
            <select name="board" id="board" required>
              <option value="">Select</option>
              <option value="0">CBSE</option>
              <option value="1">ICSE</option>
              <option value="2">State</option>
            </select>
          </div>
          <div class="form-group">
            <label for="program">Program</label>
            <select name="program" id="program" required>
              <option value="">Select</option>
              <option value="0">BCA</option>
              <option value="1">BTech</option>
            </select>
          </div>
          <div class="form-group">
            <label for="internship">Internship Experience</label>
            <select name="internship" id="internship" required>
              <option value="">Select</option>
              <option value="0">No</option>
              <option value="1">Yes</option>
            </select>
          </div>
          <div class="form-group fullwidth">
            <label for="specialisation">Specialisation</label>
            <select name="specialisation" id="specialisation" required>
              <option value="">Select</option>
              <option value="0">AI/ML</option>
              <option value="1">Computer Applications</option>
              <option value="2">CS/IT</option>
              <option value="3">Data Analytics</option>
              <option value="4">Data Science</option>
            </select>
          </div>
        </div>
        <button type="submit" class="submit-btn">Submit &amp; Get Result</button>
      </form>
      <footer class="page-footer">
        © 2025 <b>Hire Shield™</b> &mdash; Secure, Unbiased AI Campus Placement
      </footer>
    </div>
  </div>
  <script>
    // Bubble animation
    const particlesCount = 21;
    const bg = document.getElementById('particles-bg');
    for(let i=0;i<particlesCount;i++){
      let p=document.createElement('div');
      p.className='particle';
      let sz=23+Math.random()*72;
      p.style.width=sz+'px';p.style.height=sz+'px';
      p.style.left=Math.random()*100+'vw';p.style.top=Math.random()*100+'vh';
      p.style.animationDuration=9+Math.random()*8+'s';
      p.style.animationDelay=Math.random()*6+'s';
      bg.appendChild(p);
    }
  </script>
</body>
</html>
