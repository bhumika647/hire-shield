<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Applicant Login | Hire Shield</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Open+Sans&display=swap" rel="stylesheet"/>
  <style>
    html, body { height: 100%; min-height: 100vh; margin: 0; padding: 0; }
    body {
      font-family: 'Open Sans', Arial, sans-serif;
      background: radial-gradient(ellipse 110% 85% at 60% 45%, #223155 0%, #181d25 74%);
      color: #e9f2fa;
      overflow: hidden; position: relative;
    }
    .particles-bg {
      pointer-events: none; position: fixed; top:0; left:0; width:100vw; height:100vh; z-index:0;
    }
    .particle {
      position: absolute; border-radius:50%;
      background: radial-gradient(circle at 45% 40%, #36ccf9bb 0%, #8f4afb19 100%);
      opacity:.14;
      animation: float 14s linear infinite;
    }
    @keyframes float {
      0%{transform:translateY(0) scale(1);}
      50%{opacity:.23;transform:translateY(-40vh) scale(1.13);}
      100%{opacity:.11;transform:translateY(-105vh) scale(1);}
    }
    .glass-gem {
      pointer-events: none;
      position: fixed;
      left: 50%;
      top: 57%;
      width:570px; height:350px;
      background: radial-gradient(ellipse at 70% 30%, #8f4afb22 10%, #36ccf954 90%);
      filter: blur(66px) brightness(1.16);
      z-index: 0;
      opacity:.34;
      transform: translate(-50%, -50%);
    }
    .login-container {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      position: relative; z-index: 1;
    }
    .login-card {
      background: linear-gradient(115deg, rgba(40,56,91,0.84) 68%, rgba(55,97,150,0.47) 110%);
      box-shadow: 0 24px 70px #233760a3, 0 6px 48px #36ccf970;
      border-radius: 2.2em;
      padding: 3.2rem 2.6rem 1.2rem 2.6rem;
      min-width: 470px; max-width: 640px; width: 97vw;
      border: 3.1px solid #36ccf9a7;
      position: relative; 
      display: flex; flex-direction: column; align-items: center;
      animation: fadeInCard 1.4s cubic-bezier(.46,.31,.49,1.14);
    }
    @keyframes fadeInCard {
      0% {opacity: 0; transform: translateY(54px) scale(0.97);}
      45%{opacity: .65;transform:translateY(-8px) scale(1.06);}
      100% {opacity: 1; transform: none;}
    }
    .logo-float-wrapper {
      display: flex; justify-content: center; align-items: center;
      margin-top:-1.5em;margin-bottom:.38em;
      position:relative;
    }
    .logo-login-img {
      width: 100px; height: 90px; margin-bottom: .3em;
      border-radius: 80%; background: transparent;
      filter: drop-shadow(0 0 0px #36ccf9cc);
      display: block; margin-left: auto; margin-right: auto;
      animation: bounceLogo 1.3s cubic-bezier(.57,.45,.55,1.37);
    }
    @keyframes bounceLogo {
      0% {transform: scale(.93);}
      47% {transform: scale(1.13);}
      78% {transform: scale(0.97);}
      100%{transform: scale(1);}
    }
    h1 {
      text-align: center;
      font-family: 'Orbitron', 'Segoe UI', sans-serif;
      font-size: 2.1em;
      font-weight: 800;
      background: linear-gradient(90deg,#36ccf9 8%,#8f4afb 82%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-shadow: 0 3px 16px #223a7c77, 0 8px 32px #357ef7b0;
      margin: 0 0 20px 0;
      animation: fadeText 1.3s cubic-bezier(.42,.36,.45,1.14);
    }
    @keyframes fadeText {
      from{opacity:0; transform:translateY(38px);}
      to{opacity:1; transform:none;}
    }
    .error-message { color: #fa3c5a; font-weight: 700; text-align: center; margin-bottom: .8em; }
    label { font-weight: 700; color: #36ccf9; font-size: 1.13em; margin-bottom: .12em;}
    .form-group {margin-bottom: 1.6em;}
    .form-control {
      background: rgba(242,247,255,0.14); backdrop-filter: blur(11px);
      border-radius: 1.3em; padding: .77em 1.1em; font-size: 1.07em;
      color: #153a4c; border: 2px solid #224b7078;
      transition: border 0.19s, box-shadow 0.17s;
      box-shadow: 0 2px 16px #36ccf929;
      animation: fadeField 1.2s;
    }
    @keyframes fadeField { from{opacity:0;} to{opacity:1;} }
    .form-control:focus {
      border: 2.5px solid #36ccf9;
      outline: none;
      box-shadow: 0 4px 21px #8f4afba4;
    }
    .btn-login {
      border-radius: 2.2em; font-weight: 800; font-size: 1.13em;
      background: linear-gradient(93deg, #36ccf9 18%, #8f4afb 95%);
      color: #fff; border: none; padding: 0.8em 0; width: 100%;
      box-shadow: 0 2px 19px #2c6cec46;
      transition: background 0.13s, box-shadow 0.12s, transform 0.13s;
      letter-spacing: .06em; margin-top: .14em; margin-bottom: 1.5em;
      animation: btnPopIn 1.18s;
    }
    .btn-login:hover, .btn-login:focus {
      background: linear-gradient(93deg,#8f4afb 18%, #36ccf9 93%);
      box-shadow:0 11px 28px #36ccf9a9; color:#e9f2fa; transform:scale(1.06);
    }
    @keyframes btnPopIn { 
      from{opacity:0;transform:scale(0.91);}
      70%{opacity:1;transform:scale(1.08);}
      to{opacity:1;transform:none;}
    }
    .signup-row {
      width: 100%; display: flex; justify-content: flex-end; margin-top: 1.7em;
    }
    .signup-link {
      font-size: 0.86em; font-weight: 700;
      color: #36ccf9;
      background: rgba(54,204,249,0.14);
      border-radius: 1.1em;
      padding: 0.14em 0.73em;
      text-decoration: none;
      transition: background 0.13s, color 0.13s, box-shadow 0.13s;
      margin-right: .07em;
      box-shadow: 0 1px 6px #36ccf950;
      animation: fadeText 2.2s;
    }
    .signup-link:hover {
      background: linear-gradient(90deg,#8f4afb 32%, #36ccf9 90%);
      color: #fff; box-shadow: 0 3px 13px #8f4afb88;
    }
    .login-footer {
      text-align: center; color: #8f4afb;
      font-size: 0.99em; font-family: 'Orbitron', 'Segoe UI', Arial;
      margin-top: 1.55em; opacity:0.8; letter-spacing:.03em;
      animation: fadeText 2s;
    }
    @media (max-width: 700px) {
      .login-card { min-width: 97vw; max-width: 100vw; padding: 1.1rem .3rem 1.1rem .3rem;}
      h1 { font-size: 1.18em; }
      .logo-login-img { width: 56px; height: 56px;}
      .signup-row { font-size: 0.84em; }
      .glass-gem{width:330px;height:140px;}
    }
    .back-btn {
  position: absolute;
  top: 1rem;
  left: 1rem;
  padding: 0.4em 0.9em;
  font-size: 1.0rem;
  font-weight: 700;
  color: #ffffff; /* white text */
  background: #ef5350; /* filled soft red */
  border: none; /* no outline */
  border-radius: 0.8em;
  text-decoration: none;
  user-select: none;
  transition: background 0.22s, color 0.22s, transform 0.3s;
  display: inline-flex;
  align-items: center;
  gap: 0.3em;
  cursor: pointer;
  animation: pulse 1.5s infinite;
  box-shadow: 0 0 20px #ef5350cc; /* glow consistent with the red color */
}

.back-btn:hover,
.back-btn:focus {
  background: #b71c1c;
  color: #fff;
  outline: none;
}
@keyframes pulse {
  0% { box-shadow: 0 0 10px #ef5350cc;}
  50% { box-shadow: 0 0 20px #ef535088;}
  100% { box-shadow: 0 0 10px #ef5350cc;}
}
   
  </style>
</head>
<body>
  <div class="particles-bg" id="particles-bg"></div>
  <div class="glass-gem"></div>
  <div class="login-container">
    <div class="login-card" role="main" aria-label="Applicant Login Form">
      <a href="{{ url_for('welcome') }}" class="back-btn" aria-label="Back to Home">
  &#8678; Back
</a>
      <div class="logo-float-wrapper">
        <img src="{{ url_for('static', filename='images/Hire-Shield-Logo.png') }}" class="logo-login-img" alt="Hire Shield Logo"/>
      </div>
      <h1>Applicant Login</h1>
      {% if error %}<div class="error-message" role="alert">{{ error }}</div>{% endif %}
      <form method="post" style="width:100%;">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" class="form-control" name="email" id="email" required placeholder="Enter your email" autocomplete="email"/>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" class="form-control" name="password" id="password" required placeholder="Enter your password" autocomplete="current-password"/>
        </div>
        <button type="submit" class="btn btn-login">Login</button>
      </form>
      <div class="signup-row">
        <a href="{{ url_for('applicant_signup') }}" class="signup-link">New Applicant? Sign up</a>
      </div>
      <div class="login-footer">&copy; 2025 Hire Shield&trade; — Secure AI Campus Hiring</div>
    </div>
  </div>
  <script>
    const particlesCount = 27;
    const bg = document.getElementById('particles-bg');
    for (let i = 0; i < particlesCount; i++) {
      let p = document.createElement('div');
      p.className = 'particle';
      let sz = 26 + Math.random() * 120;
      p.style.width = sz + 'px';
      p.style.height = sz + 'px';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.top = Math.random() * 100 + 'vh';
      p.style.animationDuration = 8.5 + Math.random() * 14 + 's';
      p.style.animationDelay = Math.random() * 7.3 + 's';
      bg.appendChild(p);
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
